spring.application.name=apiestudiantes

# Conexion a MySQL. En Railway estos valores llegan como variables de entorno
# (referencias al servicio MySQL), asi la contrasena no queda escrita en el codigo.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Railway asigna el puerto en la variable PORT
server.port=${PORT:8080}
